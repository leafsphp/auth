app:
  - src

tests:
  engine: pest
  parallel: false
  paths:
    - tests
  files:
    - '*.test.php'
  coverage:
    local: false
    actions: true

lint:
  preset: PSR12
  rules:
    no_unused_imports: true
    not_operator_with_successor_space: false
    single_quote: true

actions:
  run:
    - lint
    - tests
  os:
    - ubuntu-latest
  php:
    extensions: json, zip, dom, curl, libxml, mbstring, PDO_PGSQL
    versions:
      - '8.3'
      - '8.2'
      - '8.1'
      - '8.0'
      - '7.4'
  events:
    - push
    - pull_request

refactor:
  paths:
    - src
    - tests
  php: '8.2'
  fluent-new-line: true
  import-names: true

analyse:
  level: 8
  paths:
    - src
  includes:
    - vendor/phpstan/phpstan/conf/bleedingEdge.neon
    - phpstan-baseline.neon
  excludePaths:
    - tests
  reportIgnoresWithoutComments: true
  reportUnmatchedIgnoredErrors: true
  treatPhpDocTypesAsCertain: false
